version: 2
updates:
  # Everything is pinned exactly, which buys reproducibility and defers breakage
  # rather than preventing it. Dependabot is the counterweight, and the
  # auto-merge workflow next door is the half that closes the PRs it opens.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
