name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: policy
          POSTGRES_PASSWORD: policy
          POSTGRES_DB: policy_asof
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U policy -d policy_asof"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # The interpreter here matches the one development runs on. Testing on a
      # different version than you ship is testing a different program.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt -e .

      - name: Apply migrations
        env:
          PGPASSWORD: policy
        run: |
          for f in migrations/*.sql; do
            psql -h localhost -p 5438 -U policy -d policy_asof -v ON_ERROR_STOP=1 -f "$f"
          done

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

      # Both directions. A checker that has never been made to fail is a checker
      # nobody has a reason to believe.
      - run: python scripts/check_clock_discipline.py
      - run: python scripts/check_clock_discipline.py --self-test

      - run: pytest -q
