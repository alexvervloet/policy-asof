# Date resolution, measured on its own. These go through the parser rather than
# past it, because an answer benchmark that phrases its own instants is testing
# the phrasing. See LESSONS 9.
resolution_cases:
  - id: explicit-iso-date
    question: What was the meal cap on 2026-02-01?
    expect: stated
    valid_at: 2026-02-01
    moves_known_at: false

  - id: written-out-date
    question: What was the rule on 1 March 2026?
    expect: stated
    valid_at: 2026-03-01
    moves_known_at: false

  - id: month-and-year
    question: What applied in March 2026?
    expect: stated
    valid_at: 2026-03-01
    moves_known_at: false

  - id: no-date-at-all
    question: How much parental leave do I get?
    expect: assumed-today
    valid_at: 2026-06-01
    moves_known_at: false

  - id: what-did-you-tell-me
    question: What did you tell me on 2026-02-01 about the meal cap?
    expect: stated
    valid_at: 2026-02-01
    moves_known_at: true

  - id: a-bare-year-is-a-range
    question: How much parental leave applied in 2024?
    expect: ambiguous-date

  - id: a-fact-about-a-person
    question: What was the stipend when I joined?
    expect: ambiguous-date

  - id: two-dates-in-one-question
    question: Was it 75 on 2026-01-01 or 90 on 2026-05-01?
    expect: ambiguous-date

  - id: vague-gesture-backwards
    question: What did it say back then?
    expect: ambiguous-date
