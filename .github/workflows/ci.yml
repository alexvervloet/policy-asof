name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: policy
          POSTGRES_PASSWORD: policy
          POSTGRES_DB: policy_asof
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U policy -d policy_asof"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      # The interpreter here matches the one development runs on. Testing on a
      # different version than you ship is testing a different program.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # A virtualenv rather than a global install, because that is what runs
      # locally and pyright resolves imports against the one named in
      # pyproject.toml. Two environments that differ is how a checker ends up
      # green in one place and full of red in the other.
      - name: Install into .venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt -e .

      # Through the runner the application uses, not through psql. A schema that
      # only comes into being when a person runs the right loop is a schema the
      # container does not have.
      - name: Apply migrations
        run: .venv/bin/python -m policy_asof.migrate

      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/mypy

      # Both checkers, whole tree. mypy erases LiteralString, so psycopg's
      # guarantee that a query cannot be built from a variable is invisible to
      # it and only pyright enforces it.
      - run: .venv/bin/pyright

      # Both directions. A checker that has never been made to fail is a checker
      # nobody has a reason to believe.
      - run: .venv/bin/python scripts/check_clock_discipline.py
      - run: .venv/bin/python scripts/check_clock_discipline.py --self-test

      - run: .venv/bin/pytest -q
