# Date-parameterised gold set.
#
# One question yields several cases, because the answer depends on when you ask
# about and when you ask. `known_at` is what the system is allowed to know;
# `valid_at` is the day the rule had to be in force.
#
# `corpus_rev` is the revision these expectations were authored against. When it
# moves and a case fails, the case is stale rather than the code regressed, and
# the harness says which. Nothing here reads the wall clock: NOW is a fixed
# instant, so these assertions mean the same thing next April.
corpus_rev: 14d5ce14652d
now: 2026-06-01T00:00:00Z

cases:
  # --- current: what is the rule today -------------------------------------
  - id: parental-leave-today
    question: How much paid parental leave am I entitled to?
    section: "4.2"
    valid_at: 2026-06-01
    known_at: 2026-06-01T00:00:00Z
    class: current
    must_contain: ["16 weeks"]
    must_not_contain: ["12 weeks"]

  - id: expense-cap-today
